# Tailscale mode: Liedmotif on this machine's `*.ts.net` name, for the tailnet
# only. Opt-in: the installer turns it on by writing
# `COMPOSE_FILE=docker-compose.yml:docker-compose.tailscale.yml` and
# `TAILSCALE_IP=<this machine's Tailscale IPv4 address>` into `.env`, so a
# development machine never loads it (Docker Desktop on macOS has no
# /var/run/tailscale). Needs Docker Compose 2.24.4 or newer for `!override`.
services:
  caddy:
    # Caddy gets `*.ts.net` certificates from the host's tailscaled, over the
    # socket in this directory. The directory, not the socket file: tailscaled
    # recreates the socket on every start, and a file mount would keep the old
    # one. Read-only, because connecting to a socket writes nothing.
    volumes:
      - /var/run/tailscale:/var/run/tailscale:ro
    # The Tailscale address alone, so a device on the home network that is not
    # on the tailnet cannot reach the app. The installer's
    # liedmotif-tailnet-only.service drops traffic for this address that reaches
    # the machine any way other than Tailscale. `!override` replaces the base
    # file's ports; a plain list would be added to them. CADDY_HTTP_PORT and
    # CADDY_HTTPS_PORT must be plain port numbers here.
    ports: !override
      - '${TAILSCALE_IP:?is not set in .env}:${CADDY_HTTP_PORT:-80}:80'
      - '${TAILSCALE_IP:?is not set in .env}:${CADDY_HTTPS_PORT:-443}:443'
